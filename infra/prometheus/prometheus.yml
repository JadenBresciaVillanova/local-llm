global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s

  - job_name: "fastapi-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 3s
    params:
      format: ['prometheus']

  # Kafka monitoring (if JMX exporter is enabled)
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9308"]
    scrape_interval: 15s

  # PostgreSQL monitoring (if postgres_exporter is added)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 15s

  # MongoDB monitoring (if mongodb_exporter is added)  
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    scrape_interval: 15s